spring.application.name=SmartClassroomERP

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/smart_classroom_erp?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

# Hibernate settings (Auto-creates tables based on your Java code)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect